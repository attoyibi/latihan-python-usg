name: Periksa

on:
  push:
    branches: [main]
  pull_request:

jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Periksa isi (materi dan challenge)
        run: python tools/validasi_konten.py
      - name: Uji pembuat konfigurasi (menolak kunci service_role)
        run: node tools/uji_buat_config.mjs
      - name: Uji skrip pendaftaran peserta (server Supabase tiruan)
        run: node tools/uji_impor.mjs
      - name: Uji pesan galat untuk peserta
        run: node tools/uji_pesan.mjs
      - name: Uji logika dashboard instruktur (rekap, saringan, CSV)
        run: node tools/uji_rekap.mjs
      - name: Uji sinkron progres ke Supabase (klien tiruan)
        run: node tools/uji_sinkron.mjs
      - name: Uji laporan praktikum dan PDF
        run: node tools/uji_laporan.mjs
      - name: Uji tantangan konsep (penilaian pilihan, urutan, seret, relasi)
        run: node tools/uji_konsep.mjs
      - name: Uji penilaian laporan dengan rubrik
        run: node tools/uji_penilaian.mjs
      - name: Uji kehadiran dan keaktifan (jadwal, siap sebelum kelas, aktivitas, skor)
        run: node tools/uji_kehadiran.mjs
      - name: Uji pencatat sesi belajar
        run: node tools/uji_sesi.mjs
      - name: Uji pengelompokan galat saat menjalankan kode
        run: node tools/uji_galat.mjs
      - name: Uji jejak peserta (riwayat, kolom, rantai putar ulang)
        run: node tools/uji_jejak.mjs
      - name: Uji riset (kohort dan ekspor anonim)
        run: node tools/uji_riset.mjs
      - name: Uji logika praktikum (berkas, contoh, ekspor HTML, laporan, rekap)
        run: node tools/uji_praktikum.mjs
      - name: Uji data praktikum (penggabungan dan antrean aman bila migrasi 0008 belum ada)
        run: node tools/uji_praktikum_data.mjs
      - name: Uji isi praktikum dengan Python sungguhan (kasus uji dan contoh jawaban)
        run: python tools/uji_praktikum.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Uji isi praktikum Java dengan JVM sungguhan (penjalan multi-berkas, contoh, kerangka)
        run: node tools/uji_praktikum_java.mjs
      - name: Uji pemantau penjalan (gagal muat, coba lagi, batas waktu)
        run: node tools/uji_penjalan.mjs
      - name: Uji perekam cara menulis dan ID perangkat
        run: node tools/uji_rekam.mjs
      - name: Uji analisis sinyal keaslian pengerjaan
        run: node tools/uji_integritas.mjs
      - name: Periksa sintaks JavaScript
        run: |
          node --check site/js/pyworker.js
          node --check site/js/javaworker.js
          for f in site/js/app.js site/js/runner.js site/js/grader.js site/js/javarunner.js site/js/sinkron.js site/js/rekap.js site/js/instruktur.js site/js/dom.js site/js/tata.js site/js/kemajuan.js site/js/anticopas.js site/js/rekam.js site/js/perangkat.js site/js/integritas.js site/js/integritas-ui.js site/js/penjalan.js site/js/laporan.js site/js/pdf.js site/js/konsep.js site/js/laporan-ui.js site/js/penilaian.js site/js/kehadiran.js site/js/kehadiran-ui.js site/js/sesi.js site/js/pencatat.js site/js/galat.js site/js/jejak.js site/js/jejak-ui.js site/js/riset.js site/js/riset-ui.js site/js/putar-ui.js site/js/praktikum.js site/js/praktikum-data.js site/js/praktikum-ui.js site/js/praktikum-dash-ui.js site/js/kunci.js site/js/praktikum-java.js; do
            node --input-type=module --check < "$f"
          done
      - name: Periksa sintaks SQL
        run: |
          pip install pglast
          python tools/periksa_sql.py
      - name: Uji migrasi dan aturan keamanan di PostgreSQL sungguhan (PGlite)
        working-directory: tools/uji_sql
        run: |
          npm ci
          npm run uji
