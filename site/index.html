<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latihan Algoritma dan Pemrograman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="home">
<header class="top">
  <button id="menuBtn" class="btn btn-ghost btn-sm" aria-label="Buka daftar bab" aria-expanded="false">Bab</button>
  <a class="logo" href="#beranda" aria-label="Beranda">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#0b7f7c"/><path d="M15 13l-7 7 7 7M25 13l7 7-7 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="20" r="2.4" fill="#3fd68f"/></svg>
    <span id="siteName">Latihan Pemrograman</span>
  </a>
  <nav class="nav" aria-label="Navigasi utama">
    <a href="#beranda" id="navHome">Dashboard</a>
    <a href="#kuliah" id="navMateri">Mata kuliah</a>
    <a href="#panduan" id="navPanduan">Panduan</a>
    <a href="#profil" id="navProfil" hidden>Profil</a>
  </nav>
  <div class="right">
    <a id="userChip" class="chip user" href="#profil" hidden title="Ubah data diri"></a>
    <button id="logoutBtn" class="btn btn-ghost btn-sm" type="button" hidden>Keluar</button>
    <a id="loginBtn" class="btn btn-primary btn-sm" href="#masuk" hidden>Masuk</a>
    <span id="progressText" class="chip progress"></span>
    <span id="pyStatus" class="chip" role="status" hidden>Python: memuat</span>
  </div>
</header>
<div class="layout">
  <nav id="sidebar" aria-label="Daftar bab">
    <div id="courseBox" class="course-box"></div>
    <ol id="babList"></ol>
    <div class="legend" aria-label="Arti penanda">
      <div><span class="st"></span> Belum dikerjakan</div>
      <div><span class="st sedang"></span> Sedang dikerjakan</div>
      <div><span class="st selesai"></span> Selesai</div>
    </div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
